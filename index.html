<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaunchJustice</title>
<meta name="description" content="Back public-interest lawsuits. Watch the clips, read the room, see the odds and the lock-in, and pledge to the cases you believe in.">
<meta name="theme-color" content="#0E141C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell" id="shell">
  <div class="views">
    <section class="view on" id="v-watch" aria-label="Case clips"></section>
    <section class="view" id="v-cases" aria-label="Browse cases"></section>
    <section class="view" id="v-case" aria-label="Case details"></section>
    <section class="view" id="v-score" aria-label="How this case is scored"></section>
    <section class="view" id="v-mine" aria-label="My pledges"></section>
    <div class="sticky-cta" id="cta"><button class="btn primary" id="ctaBtn">Pledge to this case</button></div>
  </div>
  <nav class="nav dark" id="nav" aria-label="Main">
    <div class="brand"><span class="wordmark">Launch<span>Justice</span></span><span class="tag">Demo cases</span></div>
    <button data-go="watch" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg>Watch</button>
    <button data-go="cases">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8"/></svg>Cases</button>
    <button data-go="mine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>My pledges</button>
    <div class="nav-foot" data-account></div>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="data.js"></script>
<script src="viz.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
