<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LaunchJustice Live</title>
<meta name="description" content="A ten-minute simulation of investing in litigation: three cases, a thousand credits, four years of rulings and depositions on a clock.">
<meta name="theme-color" content="#0E141C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<!-- Paths are absolute: Vercel serves this page at /sim as well as /sim/ -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/sim/sim.css">
</head>
<body>
<div class="shell sim" id="shell">
  <div class="views">
    <header class="simbar" id="simbar"></header>
    <div class="panes">
      <section class="view on" id="v-home" aria-label="Cases"></section>
      <section class="view" id="v-case" aria-label="Case"></section>
      <section class="view" id="v-port" aria-label="Your portfolio"></section>
      <section class="view" id="v-end" aria-label="Results"></section>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Main">
    <div class="brand"><span class="wordmark">Launch<span>Justice</span></span><span class="sim-tag">Live simulation</span></div>
    <button data-go="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8"/></svg>Cases</button>
    <button data-go="port">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 7"/></svg>Portfolio</button>
    <button data-go="end">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20.5h7M10 17h4v3.5h-4z"/></svg>Results</button>
    <div class="nav-foot" id="navWallet"></div>
  </nav>

  <aside class="moment" id="moment" aria-label="Breaking news"></aside>
  <div class="sr" id="srLive" aria-live="polite"></div>

  <div class="splayer" id="splayer" role="dialog" aria-modal="true" aria-label="Clip"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="/data.js"></script>
<script src="/viz.js"></script>
<script src="/sim/scenario.js"></script>
<script src="/sim/engine.js"></script>
<script src="/sim/sim.js"></script>
</body>
</html>
